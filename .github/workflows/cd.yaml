name: CD Pipeline
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu:latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute remote SSH commands using    password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            cd ~/mean-devops-deployment
            git pull origin main
            docker compose pull
            docker compose up -d

            version: "3.8"
            services:
              mongo:
                image: mongo:6
                volumes:
                  - mongo_data:/data/db

              backend:
                image: DOCKERHUB_USERNAME/mean-backend:latest
                environment:
                  - MONGO_URI=mongodb://mongo:27017/mean-db
                ports:
                  - "5000:5000"
                depends_on:
                  - mongo

              frontend:
                image: DOCKERHUB_USERNAME/mean-frontend:latest
                ports:
                  - "8081:80"
                depends_on:
                  - backend

            volumes:
              mongo_data:
            EOF

            docker-compose pull
            docker-compose up -d --force-recreate
            docker image prune -f
